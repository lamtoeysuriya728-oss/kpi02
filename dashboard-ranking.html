<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
<title>Ranking</title>

<style>
*{box-sizing:border-box;}

body{
margin:0;
font-family:'Prompt',sans-serif;
background:#0f172a;
color:white;
display:flex;
min-height:100vh;
overflow-x:hidden;
}

/* ===== TOPBAR ===== */

.topbar{
display:none;
position:fixed;
top:0;
left:0;
right:0;
height:60px;
background:#1e293b;
align-items:center;
padding:0 20px;
z-index:1002;
}

.menuBtn{
font-size:24px;
cursor:pointer;
margin-right:15px;
}

.topTitle{
font-weight:600;
}

/* ===== SIDEBAR ===== */

.sidebar{
width:250px;
background:#1e293b;
padding:30px 20px;
display:flex;
flex-direction:column;
transition:.3s;
}

.sidebar h3{
margin:0 0 30px 0;
font-weight:600;
}

.menu{
padding:12px 14px;
border-radius:10px;
text-decoration:none;
color:#cbd5e1;
margin-bottom:8px;
transition:.2s;
display:flex;
align-items:center;
gap:8px;
}

.menu:hover{
background:#334155;
color:white;
}

.menu.active{
background:#4f46e5;
color:white;
}

/* ===== OVERLAY ===== */

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.5);
z-index:1000;
display:none;
}

.overlay.show{
display:block;
}

/* ===== MAIN ===== */

.main{
flex:1;
padding:50px;
display:flex;
flex-direction:column;
align-items:center;
}

.main h2{
align-self:flex-start;
margin-bottom:20px;
}

/* ===== CARD ===== */

.card{
background:#1e293b;
padding:30px;
border-radius:16px;
width:100%;
max-width:950px;
box-shadow:0 10px 30px rgba(0,0,0,.4);
}

select{
width:100%;
max-width:300px;
padding:14px;
border-radius:8px;
border:none;
margin:10px 0 20px 0;
font-size:15px;
}

.tableWrapper{
width:100%;
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
min-width:500px;
}

th,td{
padding:12px;
text-align:left;
}

th{
background:#334155;
}

tr:nth-child(even){
background:rgba(255,255,255,.05);
}

/* ===== MOBILE ===== */

@media(max-width:768px){

.topbar{
display:flex;
}

.sidebar{
position:fixed;
left:-260px;
top:0;
bottom:0;
z-index:1001;
}

.sidebar.show{
left:0;
}

.main{
padding:100px 20px 30px 20px;
}

}
</style>
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">
<div class="menuBtn" onclick="openMenu()">☰</div>
<div class="topTitle">Ranking รายเดือน</div>
</div>

<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">

<h3 id="managerName">Loading...</h3>

<a href="dashboard-overview.html" class="menu">
📊 รายงาน KPI
</a>

<a href="dashboard-ranking.html" class="menu active">
🏆 ผลงานรวมโซน
</a>

<a href="dashboard-events.html" class="menu">
📅 ปฏิทิน
</a>

<a href="login.html" class="menu" onclick="logout()">
🚪 ออกจากระบบ
</a>

</div>

<!-- MAIN -->
<div class="main">

<h2>🏆 Ranking รายเดือน</h2>

<div class="card">

<label>เลือกเดือน</label>

<select id="monthSelect" onchange="loadRanking()">
<option value="">-- เลือกเดือน --</option>
<option value="1">มกราคม</option>
<option value="2">กุมภาพันธ์</option>
<option value="3">มีนาคม</option>
<option value="4">เมษายน</option>
<option value="5">พฤษภาคม</option>
<option value="6">มิถุนายน</option>
<option value="7">กรกฎาคม</option>
<option value="8">สิงหาคม</option>
<option value="9">กันยายน</option>
<option value="10">ตุลาคม</option>
<option value="11">พฤศจิกายน</option>
<option value="12">ธันวาคม</option>
</select>

<div class="tableWrapper">
<table>
<thead>
<tr>
<th>อันดับ</th>
<th>ชื่อ</th>
<th>ยอดรวม</th>
</tr>
</thead>
<tbody id="rankingBody">
</tbody>
</table>
</div>

</div>

</div>

<script>

const API_URL = "PUT_PRODUCTION_APPS_SCRIPT_URL_HERE";

/* ===== MENU CONTROL ===== */

function openMenu(){
document.getElementById("sidebar").classList.add("show");
document.getElementById("overlay").classList.add("show");
}

function closeMenu(){
document.getElementById("sidebar").classList.remove("show");
document.getElementById("overlay").classList.remove("show");
}

/* ===== AUTH CHECK ===== */

let code = localStorage.getItem("managerCode");
let name = localStorage.getItem("managerName");

if(!code){
location.href="login.html";
}

document.getElementById("managerName").innerText = name || "ผู้ใช้งาน";

/* ===== LOAD RANKING ===== */

function loadRanking(){

const month = document.getElementById("monthSelect").value;
if(!month) return;

fetch(`${API_URL}?action=ranking&month=${month}`)
.then(res=>res.json())
.then(data=>{

if(data.status!=="success"){
alert("โหลดข้อมูลไม่ได้");
return;
}

const tbody = document.getElementById("rankingBody");
tbody.innerHTML="";

data.ranking.forEach((item,index)=>{

tbody.innerHTML += `
<tr>
<td>${index+1}</td>
<td>${item.name}</td>
<td>${item.total.toLocaleString()}</td>
</tr>
`;

});

})
.catch(()=>{
alert("เชื่อมต่อระบบไม่ได้");
});
}

/* ===== LOGOUT ===== */

function logout(){
localStorage.clear();
}

</script>

</body>
</html>
