<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
<title>รายงาน KPI</title>

<style>
*{box-sizing:border-box;}

body{
margin:0;
font-family:'Prompt',sans-serif;
background:#0f172a;
color:white;
display:flex;
min-height:100vh;
overflow-x:hidden;
}

/* ===== TOPBAR (MOBILE) ===== */

.topbar{
display:none;
position:fixed;
top:0;
left:0;
right:0;
height:60px;
background:#1e293b;
align-items:center;
padding:0 20px;
z-index:1002;
}

.menuBtn{
font-size:24px;
cursor:pointer;
margin-right:15px;
}

.topTitle{
font-weight:600;
}

/* ===== SIDEBAR ===== */

.sidebar{
width:250px;
background:#1e293b;
padding:30px 20px;
display:flex;
flex-direction:column;
transition:.3s;
}

.sidebar h3{
margin:0 0 30px 0;
font-weight:600;
}

.menu{
padding:12px 14px;
border-radius:10px;
text-decoration:none;
color:#cbd5e1;
margin-bottom:8px;
transition:.2s;
display:flex;
align-items:center;
gap:8px;
}

.menu:hover{
background:#334155;
color:white;
}

.menu.active{
background:#4f46e5;
color:white;
}

/* ===== OVERLAY ===== */

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.5);
z-index:1000;
display:none;
}

.overlay.show{
display:block;
}

/* ===== MAIN ===== */

.main{
flex:1;
padding:50px;
display:flex;
justify-content:center;
align-items:flex-start;
}

.card{
background:#1e293b;
padding:30px;
border-radius:16px;
width:100%;
max-width:450px;
box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.card h3{
margin-top:0;
margin-bottom:20px;
}

select{
width:100%;
padding:14px;
border-radius:8px;
border:none;
margin-top:10px;
font-size:15px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:8px;
margin-top:15px;
background:#4f46e5;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
opacity:.9;
}

/* ===== LOADING ===== */

.loadingPopup{
position:fixed;
inset:0;
background:rgba(0,0,0,.7);
display:flex;
justify-content:center;
align-items:center;
z-index:2000;
visibility:hidden;
opacity:0;
transition:.25s;
}

.loadingPopup.show{
visibility:visible;
opacity:1;
}

.popupBox{
background:white;
color:black;
padding:30px;
border-radius:15px;
text-align:center;
width:90%;
max-width:320px;
}

.spinner{
width:45px;
height:45px;
border:5px solid #ddd;
border-top:5px solid #4f46e5;
border-radius:50%;
margin:auto;
animation:spin 1s linear infinite;
}

@keyframes spin{
to{transform:rotate(360deg);}
}

/* ===== MOBILE ===== */

@media(max-width:768px){

.topbar{
display:flex;
}

.sidebar{
position:fixed;
left:-260px;
top:0;
bottom:0;
z-index:1001;
}

.sidebar.show{
left:0;
}

.main{
padding:100px 20px 30px 20px;
}

}
</style>
</head>

<body>

<div class="topbar">
<div class="menuBtn" onclick="openMenu()">☰</div>
<div class="topTitle">รายงาน KPI</div>
</div>

<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">

<h3 id="managerName">Loading...</h3>

<a href="dashboard-overview.html" class="menu active">
📊 รายงาน KPI
</a>

<a href="dashboard-ranking.html" class="menu">
🏆 ผลงานรวมโซน
</a>

<a href="dashboard-events.html" class="menu">
📅 ปฏิทิน
</a>

<a href="login.html" class="menu" onclick="logout()">
🚪 ออกจากระบบ
</a>

</div>

<!-- MAIN -->
<div class="main">

<div class="card">
<h3>เพิ่มข้อมูล KPI ปี 2569</h3>

<label>เลือกเดือน</label>

<select id="monthSelect">
<option value="">-- เลือกเดือน --</option>
<option value="1">มกราคม</option>
<option value="2">กุมภาพันธ์</option>
<option value="3">มีนาคม</option>
<option value="4">เมษายน</option>
<option value="5">พฤษภาคม</option>
<option value="6">มิถุนายน</option>
<option value="7">กรกฎาคม</option>
<option value="8">สิงหาคม</option>
<option value="9">กันยายน</option>
<option value="10">ตุลาคม</option>
<option value="11">พฤศจิกายน</option>
<option value="12">ธันวาคม</option>
</select>

<button onclick="openKPI()">✏️ เปิดชีตเพื่อแก้ไข</button>

</div>

</div>

<!-- LOADING -->
<div id="loadingPopup" class="loadingPopup">
<div class="popupBox">
<div class="spinner"></div>
<div style="margin-top:15px;font-weight:500;">
กำลังโหลดข้อมูล...
</div>
</div>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbyJvNE73rWaNH6BH5ROHM858OFcepiD7glaFbLJhAg975IeG4YexODy6Wxn2gYu5gVe/exec";

/* ===== MENU CONTROL ===== */

function openMenu(){
document.getElementById("sidebar").classList.add("show");
document.getElementById("overlay").classList.add("show");
}

function closeMenu(){
document.getElementById("sidebar").classList.remove("show");
document.getElementById("overlay").classList.remove("show");
}

/* ===== SESSION CHECK ===== */

let code = localStorage.getItem("managerCode");
let name = localStorage.getItem("managerName");

if(!code || code==="undefined" || code==="null"){
alert("Session หมดอายุ กรุณาเข้าสู่ระบบใหม่");
localStorage.clear();
window.location.href="login.html";
}

document.getElementById("managerName").innerText = name || "ผู้ใช้งาน";

/* ===== OPEN KPI ===== */

function openKPI(){

const month = document.getElementById("monthSelect").value;
if(!month){
alert("กรุณาเลือกเดือนก่อน");
return;
}

const popup = document.getElementById("loadingPopup");
popup.classList.add("show");

fetch(`${API_URL}?action=getlink&code=${encodeURIComponent(code)}&month=${month}`)
.then(res=>res.json())
.then(data=>{
popup.classList.remove("show");

if(data.status==="success"){
window.open(data.link,"_blank");
}else{
alert("ไม่พบลิงก์เดือนนี้");
}
})
.catch(()=>{
popup.classList.remove("show");
alert("เชื่อมต่อระบบไม่ได้");
});
}

/* ===== LOGOUT ===== */

function logout(){
localStorage.clear();
}

</script>

</body>
</html>
